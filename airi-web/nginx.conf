server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history routing: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API. Same-origin from the browser's perspective, so no CORS
    # configuration is required in the Compose setup.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Hashed asset filenames are safe to cache aggressively.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
